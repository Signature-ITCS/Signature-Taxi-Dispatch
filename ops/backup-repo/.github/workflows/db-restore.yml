# Restore the database from a nightly backup — "one click".
#
# Actions → "Restore database" → Run workflow → enter the backup date (or
# "latest") and type RESTORE → Run.
#
# What it does: downloads that day's backup made by "Back up database", then
# replaces every app table, function and row in the database at
# SUPABASE_DB_URL with the backed-up copy, and adds back any staff/driver
# logins that are missing. Bookings made after the backup are LOST — this is
# for a crashed, wiped or brand-new database.
#
# To restore into a NEW Supabase project, first change the SUPABASE_DB_URL
# secret to the new project's Session pooler connection string.

name: Restore database

on:
  workflow_dispatch:
    inputs:
      backup_date:
        description: "Backup date, YYYY-MM-DD (UTC), or 'latest'"
        required: true
        default: latest
      confirm:
        description: "Type RESTORE to overwrite the database"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  restore:
    # Pinned: the PostgreSQL apt repo must support the runner OS, and
    # ubuntu-latest moves to Ubuntu 26 from 19 Oct 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GH_TOKEN: ${{ github.token }}
      BACKUP_DATE: ${{ inputs.backup_date }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - uses: actions/checkout@v4

      - name: Safety check
        run: |
          if [ "$CONFIRM" != "RESTORE" ]; then
            echo "::error::Type RESTORE (capitals) in the confirm box to run a restore."
            exit 1
          fi
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::The SUPABASE_DB_URL secret is not set."
            exit 1
          fi

      - name: Find the backup
        run: |
          set -euo pipefail
          mkdir -p backup
          # The one-year copies (releases "backup-<date>") first…
          if [ "$BACKUP_DATE" = "latest" ]; then
            TAG=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName' | grep '^backup-' | sort | tail -1 || true)
          else
            TAG="backup-$BACKUP_DATE"
          fi
          if [ -n "$TAG" ] && gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p 'platform-db-*.sql.gz' -D backup 2>/dev/null; then
            echo "Using release $TAG"
          else
            # …then the 30-day copies attached to the backup runs.
            RUNS=$(gh run list -R "$GITHUB_REPOSITORY" --workflow db-backup.yml --status success --limit 200                      --json databaseId,createdAt)
            if [ "$BACKUP_DATE" = "latest" ]; then
              RUN_ID=$(echo "$RUNS" | jq -r 'sort_by(.createdAt) | last | .databaseId // empty')
            else
              RUN_ID=$(echo "$RUNS" | jq -r --arg d "$BACKUP_DATE"                          '[.[] | select(.createdAt | startswith($d))] | sort_by(.createdAt) | last | .databaseId // empty')
            fi
            if [ -z "$RUN_ID" ]; then
              echo "::error::No backup found for '$BACKUP_DATE'. Backups are kept 365 days (Releases)."
              exit 1
            fi
            echo "Using backup run $RUN_ID"
            gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n db-backup -D backup
          fi
          rm -f backup/companies-*.tar.gz
          gunzip backup/*.sql.gz
          ls -lh backup

      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          # The runner image ships an older client whose psql wins on PATH; use 17.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Restore app tables and data
        run: |
          set -euo pipefail
          FILE=$(ls backup/*.sql | head -1)
          # Split the file: part 1 = app (public), part 2 = logins (auth data).
          awk '/^-- ── 2\. Staff and driver logins/{part=2} {print > (part==2 ? "backup/auth.sql" : "backup/public.sql")}' "$FILE"
          # Supabase's own event triggers (e.g. ensure_rls → rls_auto_enable)
          # use functions that live in the public schema. They can't be dropped
          # while the trigger exists, so replace them in place instead.
          for fn in $(psql "$SUPABASE_DB_URL" -At -c "select distinct p.proname from pg_event_trigger e join pg_proc p on p.oid = e.evtfoid join pg_namespace n on n.oid = p.pronamespace where n.nspname = 'public'"); do
            echo "Keeping event-trigger function public.$fn (replaced in place)"
            sed -i -E "/^DROP FUNCTION IF EXISTS \"public\"\.\"$fn\"\(\);$/d; s/^CREATE FUNCTION \"public\"\.\"$fn\"\(/CREATE OR REPLACE FUNCTION \"public\".\"$fn\"(/" backup/public.sql
          done
          # Default privileges are Supabase's own (already set on every project);
          # the postgres login may not change them, so skip those lines.
          sed -i -E '/^ALTER DEFAULT PRIVILEGES /d' backup/public.sql
          # All or nothing: if anything fails, the database is left as it was.
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --single-transaction -q -f backup/public.sql
          echo "App tables restored."

      - name: Restore staff and driver logins
        run: |
          # Logins that already exist are skipped (ON CONFLICT DO NOTHING in the
          # backup), so this only ever adds missing ones.
          psql "$SUPABASE_DB_URL" -q -f backup/auth.sql && echo "Logins restored." \
            || echo "::warning::Some logins could not be loaded."

      - name: Lock the internal functions again
        run: |
          # Re-created functions get Supabase's default grants (anon, authenticated);
          # the platform's internal ones must stay server-only. Failing here is
          # serious: stop and say so.
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f .github/scripts/lock-functions.sql
          echo "Internal functions locked."

      - name: Re-enable live updates and refresh the API
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=0 -q <<'SQL'
          grant usage on schema public to anon, authenticated, service_role;
          do $$
          begin
            if exists (select 1 from pg_publication where pubname = 'supabase_realtime') then
              begin alter publication supabase_realtime add table public.bookings; exception when others then null; end;
              begin alter publication supabase_realtime add table public.drivers; exception when others then null; end;
              begin alter publication supabase_realtime add table public.activity_logs; exception when others then null; end;
              begin alter publication supabase_realtime add table public.staff_notifications; exception when others then null; end;
            end if;
          end $$;
          notify pgrst, 'reload schema';
          SQL
          echo "Restore finished."
